[package]
name = "ghidra-elf-symbols"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Source-guided Ghidra ELF string- and symbol-table parser"

[dependencies]
ghidra-elf = { path = "..", version = "0.1.0" }
ghidra-elf-sections = { path = "../section-headers", version = "0.1.0" }

[lib]
name = "ghidra_elf_symbols"
path = "src/lib.rs"

[[bin]]
name = "ghidra-elf-symbols"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = false
strip = false
